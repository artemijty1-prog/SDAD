<main class="clearfix">
            <form action="#" method="POST" id="contact-form">
                <div class="form_item">
                    <label for="topic">Тема</label><br>
                    <select name="topic" id="topic" required>
                        <option value="1">Заказать услугу</option>
                        <option value="2">Оставить отзыв/замечание</option>
                        <option value="3">Предложить сотрудничество</option>
                        <option value="4">Другое</option>
                    </select>
                </div>
                <div class="form_item">
                    <label for="name">Имя</label><br>
                    <input type="text" name="name" id="name" placeholder="Введите ваше имя" required>
                </div>

                <div class="form_item">
                    <label for="email">E-mail</label><br>
                    <input type="email" name="email" id="email" placeholder="example@domain.com" required>
                </div>
                <div class="form_item">
                    <label for="tel">Телефон</label><br>
                    <input type="tel" name="tel" id="tel" placeholder="+7 (999) 999-99-99" required>
                </div>
                <div class="form_item">
                    <label for="date">Желаемая дата контакта</label><br>
                    <input type="date" name="date" id="date" required  >
                </div>
                <div class="form_item">
                    <label for="message">Текст сообщения</label><br>
                    <textarea name="message" id="message" placeholder="Напишите ваше сообщение здесь..." required></textarea>
                </div>
                <div class="form_item">
                    <input type="submit" value="Отправить">
                </div>
            </form>
